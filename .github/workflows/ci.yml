name: CI

# Each run is titled with its branch and commit message (or PR title), so the list shows what is being processed.
run-name: ${{ github.event_name == 'pull_request' && format('PR #{0}: {1}', github.event.number, github.event.pull_request.title) || format('{0}: {1}', github.ref_name, github.event.head_commit.message) }}

# Runs on every push to dev/main and on every pull request into them.
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, tests and build (${{ github.head_ref || github.ref_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Commit being tested
        # Values come through env vars (never pasted into the script) so a commit message cannot inject commands.
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MSG: ${{ github.event.head_commit.message || github.event.pull_request.title }}
          AUTHOR: ${{ github.event.head_commit.author.name || github.actor }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          {
            echo "### Commit being tested"
            echo "- **Branch:** \`${BRANCH}\`"
            echo "- **Commit:** [\`${SHA:0:7}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${SHA})"
            echo "- **Message:** $(printf '%s' "$MSG" | head -n 1)"
            echo "- **Author:** ${AUTHOR}"
            echo "- **Triggered by:** ${GITHUB_EVENT_NAME}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit and component tests
        run: npm test
      - name: Build the app
        run: npm run build
      - name: Build the server
        run: npm run build:server
