name: Firestore rules

# Tests firestore.rules against the Firestore emulator. Runs only when the rules or their tests change,
# or by hand from the Actions tab ("Run workflow").
on:
  push:
    branches: [dev, main]
    paths:
      - firestore.rules
      - firestore-rules/**
      - firebase.json
  pull_request:
    paths:
      - firestore.rules
      - firestore-rules/**
      - firebase.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Commit being tested
        # Values come through env vars (never pasted into the script) so a commit message cannot inject commands.
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MSG: ${{ github.event.head_commit.message || github.event.pull_request.title }}
          AUTHOR: ${{ github.event.head_commit.author.name || github.actor }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          {
            echo "### Commit being tested"
            echo "- **Branch:** \`${BRANCH}\`"
            echo "- **Commit:** [\`${SHA:0:7}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${SHA})"
            echo "- **Message:** $(printf '%s' "$MSG" | head -n 1)"
            echo "- **Author:** ${AUTHOR}"
            echo "- **Triggered by:** ${GITHUB_EVENT_NAME}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Run the rules tests in the Firestore emulator
        run: npx --yes firebase-tools@latest emulators:exec --only firestore --project demo-resume-ai "npx vitest run firestore-rules"
