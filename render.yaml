# One Render web service: serves the built app and the AI proxy (keys stay on the server).
# Step 1 of the setup: deploy WITHOUT AI keys first (manual editing works), add keys once sign-in is in place.
services:
  - type: web
    name: resume-ai
    runtime: node
    plan: free
    branch: dev
    buildCommand: npm ci --include=dev && npm run build && npm run build:server
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: TRUST_PROXY
        value: "1"
      # Added later, in the Render dashboard (never commit real values):
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
